<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tenkasi District Collector – Online Petition</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:url("/static/images/kuttralam.jpg") no-repeat center center fixed;
    background-size:cover;
    display:flex;
    justify-content:center;
    align-items:center;
}
.overlay{
    background:rgba(0,0,0,0.55);
    position:absolute;
    inset:0;
}

.admin-btn{
    position: fixed;
    top: 20px;
    right: 30px;
    z-index: 9999;
}

.admin-btn a{
    background: linear-gradient(135deg,#1e272e,#485460);
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    transition: 0.3s;
}

.admin-btn a:hover{
    background: linear-gradient(135deg,#0984e3,#6c5ce7);
    transform: scale(1.05);
}


.card{
    background:#fff;
    width:420px;
    padding:30px;
    border-radius:14px;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
    position:relative;
    z-index:1;
}

h1{text-align:center;font-size:22px;color:#2c3e50;}
.subtitle{text-align:center;font-size:13px;color:#636e72;margin-bottom:20px;}

label{font-size:13px;font-weight:600;margin-top:12px;display:block;}
input,select,textarea{
    width:100%;
    padding:11px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ced6e0;
    background:#f8f9fa;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#0984e3,#6c5ce7);
    color:#fff;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
<div class="admin-btn"> 
<a href="/admin_login">Admin Login</a> 
</div>
<h1>Tenkasi District Collectorate</h1>
<div class="subtitle">Online Public Grievance & Petition System</div>

<form method="post" enctype="multipart/form-data" onsubmit="return validateMobile()">

<label>Citizen Name</label>
<input type="text" name="name" required>

<label>Mobile Number</label>
<input type="text" name="mobile" id="mobile" required>

<label>Email (Optional)</label>
<input type="email" name="email">

<label>Taluk</label>
<select name="place" required>
<option value="">-- Select Taluk --</option>
<option>Tenkasi</option>
<option>Sankarankovil</option>
<option>Shenkottai</option>
<option>Alangulam</option>
<option>Kadayam</option>
</select>

<label>Concerned Department</label>
<select name="department" required>
<option value="">-- Select Department --</option>
<option>Revenue Department</option>
<option>Social Welfare & Pension</option>
<option>Rural Development</option>
<option>Water Supply</option>
<option>Electricity (TANGEDCO)</option>
<option>Public Works Department</option>
</select>

<label>Problem Description</label>
<textarea name="problem" required></textarea>

<label>Upload Proof (Image/PDF)</label>
<input type="file" name="proof">

<!-- Auto date for analytics -->
<input type="hidden" name="created_at" id="created_at">

<button type="submit">Submit Petition</button>

</form>

<div style="text-align:center;margin-top:15px;">
<a href="/track">Track Petition Status</a>
</div>

</div>

<script>

document.getElementById("created_at").value =
new Date().toISOString().slice(0,19).replace("T"," ");

function validateMobile(){
const mobile=document.getElementById("mobile").value;
if(!/^[6-9]\d{9}$/.test(mobile)){
alert("Enter valid 10-digit Indian mobile number");
return false;
}
return true;
}
</script>

</body>
</html>
